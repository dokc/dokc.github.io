baseURL = 'https://dok.community/'
languageCode = 'en-us'
title = 'Data on Kubernetes Community'
enableRobotsTXT = true
timeZone = 'UTC'
summaryLength = 30

[taxonomies]
  category = 'categories'
  tag = 'tags'

# Keep the WordPress URLs so existing links and search results still work.
[permalinks.page]
  blog = '/blog/:slug/'
  newsroom = '/newsroom/:slug/'
  dok-events = '/dok-events/:slug/'
  resources = '/resources/:slug/'
[permalinks.taxonomy]
  categories = '/blog/category/'
  tags = '/blog/tag/'
[permalinks.term]
  categories = '/blog/category/:slug/'
  tags = '/blog/tag/:slug/'

[pagination]
  pagerSize = 12

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html']

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.parser.attribute]
  block = true

# Rebuild Tailwind CSS whenever templates add or remove classes (hugo server otherwise serves stale CSS).
[build.buildStats]
  enable = true
[[build.cachebusters]]
  source = 'assets/notwatching/hugo_stats\.json'
  target = 'css'
[[build.cachebusters]]
  source = '(postcss|tailwind)\.config\.js'
  target = 'css'

[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  disableWatch = true
  source = 'hugo_stats.json'
  target = 'assets/notwatching/hugo_stats.json'

[params]
  tagline = 'The people who run data on Kubernetes'
  description = 'The Data on Kubernetes Community is where users go to run data on Kubernetes (DoK). We facilitate the creation and sharing of best practices to help users advance in their DoK journey.'
  copyrightHolder = 'Data on Kubernetes Community'
  licenseName = 'CC BY 4.0'
  licenseURL = 'https://creativecommons.org/licenses/by/4.0/'
  ogImage = 'images/orbit-hero.png'

  # Shared external links. Reference them from content as "@slack", "@meetup", etc.
  [params.links]
    slack = 'https://join.slack.com/t/dokcommunity/shared_invite/zt-4djtj1cwk-Z3iYonK9dFRN28QVpgQPqA'
    meetup = 'https://www.meetup.com/data-on-kubernetes-community/'
    youtube = 'https://www.youtube.com/@DoKcommunity'
    github = 'https://github.com/dokc'
    getStarted = 'https://github.com/dokc/Get-Started'
    codeOfConduct = 'https://github.com/cncf/foundation/blob/main/code-of-conduct.md'
    sponsor = 'mailto:dok@solanica.io?subject=DoK%202027%20sponsorship'
    core = 'mailto:dok@solanica.io'
    # Interim mailto links until the new forms exist; replace each with its form URL.
    pilotsApply = 'mailto:dok@solanica.io?subject=DoK%20Pilots%20application'
    nominate = 'mailto:dok@solanica.io?subject=Contributor%20nomination'
    dockApply = 'mailto:dok@solanica.io?subject=Start%20a%20Dock'
    eventSubmit = 'mailto:dok@solanica.io?subject=DoK%20meetup%20event'
    speakerDatabase = 'mailto:dok@solanica.io?subject=DoK%20speaker%20database'

  [params.headerCTA]
    label = 'Join the Slack'
    url = '@slack'

  [params.newsletter]
    action = 'https://community.us1.list-manage.com/subscribe/post?u=69b500056de7204820b34995c&id=76703c9e82'

  # Site-wide bar above the header. Leave text empty to hide it.
  [params.announcement]
    text = ''
    url = ''

  # GA4 measurement ID. Loaded only in production builds; leave empty to disable.
  [params.analytics]
    ga4 = ''

