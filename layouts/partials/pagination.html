{{- $pag := .Paginator -}}
{{- if gt $pag.TotalPages 1 -}}
<nav class="mt-14 flex items-center justify-between gap-4 border-t border-line pt-6" aria-label="{{ i18n "pageOf" (dict "Current" $pag.PageNumber "Total" $pag.TotalPages) }}">
  {{- if $pag.HasPrev }}
  <a class="btn btn-outline" href="{{ $pag.Prev.URL }}" rel="prev">&larr; {{ i18n "newer" }}</a>
  {{- else }}<span></span>{{ end }}
  <span class="font-mono text-sm text-muted">{{ i18n "pageOf" (dict "Current" $pag.PageNumber "Total" $pag.TotalPages) }}</span>
  {{- if $pag.HasNext }}
  <a class="btn btn-outline" href="{{ $pag.Next.URL }}" rel="next">{{ i18n "older" }} &rarr;</a>
  {{- else }}<span></span>{{ end }}
</nav>
{{- end -}}
