{{ define "main" }}
{{ partial "page-header.html" (dict "page" .) }}
<div class="container-dok py-14 lg:py-20">
  {{- with .Content }}<div class="prose mb-12">{{ . }}</div>{{ end }}
  {{- $pag := .Paginate .RegularPages }}
  <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    {{- range $pag.Pages }}{{ partial "cards/post.html" . }}{{ end }}
  </div>
  {{ partial "pagination.html" . }}
</div>
{{ partial "sections.html" . }}
{{ end }}
